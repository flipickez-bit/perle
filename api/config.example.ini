; ─────────────────────────────────────────────────────────────────────
;  Configuration de Perle
;
;  Copiez ce fichier en « config.ini » et remplissez les trois valeurs
;  de la base de donnees. Pas de guillemets, pas d'apostrophes, pas de
;  virgule en fin de ligne : ecrivez la valeur telle quelle.
; ─────────────────────────────────────────────────────────────────────

bdd_type        = mysql
bdd_hote        = localhost
bdd_port        = 3306
bdd_nom         = REMPLACER_nom_de_la_base
bdd_utilisateur = REMPLACER_utilisateur
bdd_motdepasse  = REMPLACER_mot_de_passe

site_url = https://perleexperience.com
contact  = contact@perleexperience.com

; Protege api/installer.php. A supprimer apres installation.
jeton_installation = REMPLACER_par_une_suite_aleatoire

; Laisser « aucun » tant qu'aucune cle Stripe n'est renseignee : le site
; propose alors le reglement sur place plutot qu'un bouton qui echoue.
paiement_fournisseur    = aucun
paiement_cle_secrete    =
paiement_cle_publique   =
paiement_webhook_secret =
