<head>

 <style>
 :root {
 --pink: #F8C1CC;
 --champagne: #E6D7B8;
 --cream: #FDF6EE;
 --beige: #E6D7B8;
 --caramel: #4B2E20; /* aligné sur le marron de la charte */
 --dark: #2C2C2A;
 --brown: #4B2E20;
 --navbg: #E6D7B8;
 --ff-head: 'Playfair Display', Georgia, serif;
 --ff-body: 'Raleway', sans-serif;
 --ease: cubic-bezier(.4,0,.2,1);
 }
 *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 body {
 font-family: var(--ff-body); color: var(--dark); line-height: 1.6; min-height: 100vh;
 -webkit-font-smoothing: antialiased;
 background:
 radial-gradient(ellipse 70% 50% at 50% 0%, rgba(248,193,204,.5) 0%, transparent 60%),
 radial-gradient(ellipse 60% 45% at 50% 100%, rgba(230,215,184,.45) 0%, transparent 60%),
 var(--cream);
 display: flex; justify-content: center; padding: 48px 20px 64px;
 }
 a { text-decoration: none; color: inherit; }
 h1 { font-family: var(--ff-head); font-weight: 500; }
 ::selection { background: var(--pink); color: var(--brown); }

.card { width: 100%; max-width: 460px; text-align: center; }

 /* ── EN-TÊTE ── */
.card-head { margin-bottom: 36px; }
.card-logo {
 width: 104px; height: 104px; margin: 0 auto 18px; border-radius: 50%;
 background: var(--navbg); overflow: hidden;
 box-shadow: 0 14px 40px rgba(75,46,32,.18); animation: pop.6s var(--ease) both;
 }
 /* Le logo occupe toute la bulle, en rond */
.card-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
 @keyframes pop { 0% { opacity: 0; transform: scale(.85); } 100% { opacity: 1; transform: scale(1); } }
.card-name { font-size: 2.4rem; color: var(--brown); letter-spacing:.02em; margin-bottom: 4px; }
.card-tagline { font-family: var(--ff-head); font-style: italic; font-size: 1rem; color: var(--caramel); margin-bottom: 20px; }
.card-welcome { font-weight: 300; font-size:.98rem; color: var(--dark); opacity:.8; max-width: 380px; margin: 0 auto; line-height: 1.75; }

 /* ── BOUTONS ── */
.links { display: flex; flex-direction: column; gap: 14px; margin-top: 34px; }
.link-btn {
 display: flex; align-items: center; gap: 16px; width: 100%;
 padding: 17px 22px; border-radius: 16px; background: #fff;
 border: 1px solid rgba(75,46,32,.08); box-shadow: 0 6px 20px rgba(75,46,32,.07);
 font-weight: 600; font-size:.98rem; color: var(--brown);
 transition: transform.25s var(--ease), box-shadow.25s var(--ease), background.25s var(--ease);
 opacity: 0; transform: translateY(16px); animation: rise.5s var(--ease) forwards;
 }
.link-btn:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(75,46,32,.16); background: var(--cream); }
.link-btn:focus-visible { outline: 3px solid var(--caramel); outline-offset: 2px; }
.link-btn:active { transform: translateY(-1px); }
 @keyframes rise { to { opacity: 1; transform: none; } }
.link-btn.ic {
 flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px;
 display: flex; align-items: center; justify-content: center; color: #fff;
 }
.link-btn.ic svg { width: 22px; height: 22px; }
.link-btn.lbl { flex: 1; text-align: left; }
.link-btn.chev { color: var(--caramel); opacity:.5; flex-shrink: 0; transition: transform.25s var(--ease); }
.link-btn:hover.chev { transform: translateX(4px); opacity: 1; }

 /* Couleurs d'icônes (marque) */
.ic-web { background: var(--brown); }
.ic-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
.ic-tiktok { background: #010101; }
.ic-fb { background: #1877F2; }
.ic-linkedin { background: #0A66C2; }
.ic-google { background: linear-gradient(135deg, #4285F4, #34A853); }
.ic-call { background: #4B2E20; } /* icône blanche : il faut un fond foncé */

 /* ── PIED ── */
.card-foot { margin-top: 40px; font-size:.78rem; color: var(--brown); opacity:.55; letter-spacing:.04em; }
.card-foot a { color: var(--caramel); font-weight: 600; }

 @media (max-width: 480px) {
.card-name { font-size: 2rem; }
.link-btn { padding: 15px 18px; font-size:.92rem; gap: 13px; }
.link-btn.ic { width: 40px; height: 40px; }
 }
 @media (prefers-reduced-motion: reduce) {
 *, *::before, *::after { animation: none !important; transition: none !important; }
.link-btn { opacity: 1; transform: none; }
 }
 </style>
</head>
